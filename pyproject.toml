[project]
name = "paraguay-informality"
version = "1.0.0"
description = "Who works without a pension in Paraguay: survey-design-aware estimation and prediction from EPHC microdata"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.4",
                "pyreadstat>=1.2", "PyYAML>=6.0", "Jinja2>=3.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
informality = "informality.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
